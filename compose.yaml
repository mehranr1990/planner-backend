# Deployment only. Verify startup and named-volume persistence before release.
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [database]
    restart: unless-stopped
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api:
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      LOG_LEVEL: info
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL with postgres as host}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set public HTTPS API origin}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set strong auth secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAIL_MODE: smtp
      MAIL_FROM: ${MAIL_FROM:?Set verified sender}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP user}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP password}
      STORAGE_ROOT: /var/lib/mehran/files
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-10485760}
      FILE_UPLOAD_TIMEOUT_MS: ${FILE_UPLOAD_TIMEOUT_MS:-120000}
      FILE_UPLOAD_TTL_SECONDS: ${FILE_UPLOAD_TTL_SECONDS:-3600}
      FILE_LINK_TTL_SECONDS: ${FILE_LINK_TTL_SECONDS:-300}
    volumes:
      - private_files:/var/lib/mehran/files
    ports:
      - 127.0.0.1:3000:3000
    networks: [database, edge]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *bounded-logs
networks:
  database:
    internal: true
  edge: {}
volumes:
  postgres_data: {}
  private_files: {}
