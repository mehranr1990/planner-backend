# Mehran Planner clamd (ADR 0068). Mounted read-only over the image default.
# The image entrypoint waits for this local socket; TCP serves the private
# scanner network only (no published port).
Foreground yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
DatabaseDirectory /var/lib/clamav
LogTime yes
LogClean no
MaxThreads 4
MaxConnectionQueueLength 30
CommandReadTimeout 10
ReadTimeout 60
SelfCheck 600
ConcurrentDatabaseReload yes

# Must be >= MALWARE_SCAN_MAX_BYTES (default 64 MiB).
StreamMaxLength 64M
MaxFileSize 64M
MaxScanSize 256M
MaxRecursion 16
MaxFiles 10000

# Fail closed: anything not fully scanned is reported, never passed as clean.
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
AlertOLE2Macros yes
HeuristicScanPrecedence yes
