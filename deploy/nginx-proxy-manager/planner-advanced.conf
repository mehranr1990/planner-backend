# Paste into NPM -> Proxy Host (Planner) -> Advanced -> Custom Nginx Configuration.
# The proxy host itself forwards to http://web:3000 (Next.js, incl. /sw.js).
# Keep slightly above FILE_MAX_BYTES; the API enforces the real limit.
client_max_body_size 16m;

# NPM's global nginx.conf trusts X-Real-IP from every private range (10/8,
# 172.16/12, 192.168/16), so a LAN or Docker-host client could choose its own
# address. A server-level list replaces the inherited one: trust no hop here,
# keeping $remote_addr as the real connecting peer.
set_real_ip_from 127.0.0.1/32;

# REST API and Better Auth on the same origin. The forwarded client address is
# overwritten (never appended), and the API trusts it only from NPM's fixed IP.
location /api/ {
    set $planner_api http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 180s;
    proxy_pass $planner_api;
}

# Health endpoints stay on the private Docker network.
location /health/ {
    return 404;
}
